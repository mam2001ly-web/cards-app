<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة كروت الشبكة</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .card-item { background: #e9ecef; padding: 10px; margin: 5px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>إدارة كروت الشبكة</h2>
    <input type="text" id="cardNumber" placeholder="أدخل رقم الكرت (مثال: 1234-5678)">
    <button onclick="addCard()">إضافة الكرت</button>
    <hr>
    <h3>الكروت المسجلة</h3>
    <div id="cardsList">جاري التحميل...</div>
</div>

<script>
    // إعدادات الاتصال بمشروعك على Supabase
    const supabaseUrl = 'https://oamhbeewsexdrayrmeda.supabase.co'
    const supabaseKey = 'sb_publishable_Xp4wtYqVz3cVbI2FkZMzRw_HiaawjU2'
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey)

    async function addCard() {
        const cardNum = document.getElementById('cardNumber').value;
        if (!cardNum) {
            alert('الرجاء إدخال رقم الكرت');
            return;
        }

        const { data, error } = await _supabase
            .from('cards')
            .insert([{ card_number: cardNum }]);

        if (error) {
            alert('خطأ أثناء الحفظ: ' + error.message);
        } else {
            alert('تم إضافة الكرت بنجاح!');
            document.getElementById('cardNumber').value = '';
            fetchCards();
        }
    }

    async function fetchCards() {
        const { data, error } = await _supabase.from('cards').select('*').order('id', { ascending: false });
        const listDiv = document.getElementById('cardsList');
        
        if (error) {
            listDiv.innerHTML = 'خطأ في جلب البيانات';
            return;
        }

        if (data.length === 0) {
            listDiv.innerHTML = '<p>لا توجد كروت مضافة حالياً</p>';
            return;
        }

        listDiv.innerHTML = data.map(c => `
            <div class="card-item">
                <span><b>${c.card_number}</b></span>
                <span style="color: ${c.status === 'active' ? 'green' : 'red'};">${c.status}</span>
            </div>
        `).join('');
    }

    // جلب الكروت عند فتح الصفحة
    fetchCards();
</script>

</body>
</html>
